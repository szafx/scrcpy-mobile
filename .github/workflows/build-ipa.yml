name: Build unsigned IPA

# 不签名 IPA，用 Sideloadly 重签后装进手机。
#
# 三个上游坑（已在这份 workflow 里绕过）：
#   1. porting/Makefile 的 all 目标里有个悬空的 `ish`（无规则）→ 不能直接 make libs，要逐个目标调
#   2. external/adb-mobile 需要 protoc → brew install protobuf
#   3. porting/libtsnet 上游漏了 go.mod（只有 go.sum）→ 现场 go mod init
#      而 Xcode 链接要靠它产出 libtsnet-forwarder.a（make libs 不含这一步）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: 检出代码（含全部 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 准备 Go（libtsnet 要用）
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 显示环境信息
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== iOS SDK ==="; xcrun --sdk iphoneos --show-sdk-version
          echo "=== Go ==="; go version
          echo "=== 构建工具 ==="
          for t in cmake ninja meson pkg-config nasm protoc; do
            printf '%-12s ' "$t"; command -v $t || echo '(缺)'
          done
          echo "=== Android SDK（scrcpy-server 要用）==="
          ls -d "$HOME/Library/Android/sdk" 2>/dev/null && echo "  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== JDK ==="
          /usr/libexec/java_home -V 2>&1 | head -6 || true

      - name: 安装构建依赖
        run: |
          brew install meson ninja pkg-config nasm fmt googletest 2>&1 | tail -15

      - name: 准备 protobuf（用 brew 当前版）
        run: |
          # 为什么不再强求 28.3：
          #   adb-mobile 的 check-protobuf-version 要求精确 28.3，但三条路都试过、都不通：
          #     a) 装 28.3 的 release zip —— 里面只有 bin/ 和 include/，没有 lib/
          #     b) 装作者 formula 的 bottle —— 2024 年编的，链 abseil 2407.0.0，
          #        而 brew 现在给的是 20260817.0，protoc 一跑就 dyld abort
          #     c) 源码编 28.3 + 自带 abseil —— release tarball 里 third_party/abseil-cpp 是空的
          #   adb-mobile 是「构建时用 protoc 生成 C++」的，生成器与运行时同源即可自洽，
          #   不需要钉死版本。所以用 brew 当前的，把那条检查绕过去（下一步）。
          brew install protobuf
          protoc --version

      - name: 绕过 adb-mobile 的 protobuf 版本检查
        run: |
          M=external/adb-mobile/Makefile
          cp "$M" "$M.bak"
          sed -i '' 's/^all: check-protobuf-version libs/all: libs/' "$M"
          sed -i '' 's/^check-protobuf-version:/check-protobuf-version-SKIPPED:/' "$M"
          echo "--- 改后的前 12 行 ---"
          head -12 "$M"

      - name: 准备 JDK 17
        run: |
          brew install openjdk@17 2>&1 | tail -5
          JDK="$(brew --prefix openjdk@17)"
          echo "JAVA_HOME=$JDK" >> $GITHUB_ENV
          echo "$JDK/bin" >> $GITHUB_PATH

      - name: 构建 porting 库
        working-directory: porting
        run: |
          set -e
          echo "===== [1/6] adb-mobile ====="
          make adb-mobile
          echo "===== [2/6] SDL ====="
          make libsdl
          echo "===== [3/6] FFmpeg ====="
          make ffmpeg
          echo "===== [4/6] scrcpy ====="
          make scrcpy
          echo "===== [5/6] scrcpy-server ====="
          make scrcpy-server
          echo "===== [6/6] libtsnet（上游缺 go.mod，现场补）====="
          cd libtsnet
          if [ ! -f go.mod ]; then
            go mod init me.wsen.scrcpy-tsnet
          fi
          go mod tidy
          cd ..
          make tsnet-forwarder
          echo "===== [7/7] libfrp（内嵌给 App 的 frp visitor）====="
          cd libfrp
          go mod tidy
          make build-iphoneos-arm64
          cp -v build/iphoneos/arm64/libfrp-forwarder.a ../libs/iphoneos/arm64/
          cp -v build/iphoneos/arm64/libfrp-forwarder.h ../libs/include/
          cd ..
          echo "===== 产物清单 ====="
          ls -lh libs/iphoneos/arm64/ | head -40

      - name: 编译 App（不签名）
        run: |
          xcodebuild \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app out/Payload/
          cd out && zip -qry ../ScrcpyRemote-unsigned.ipa Payload
          ls -lh ../ScrcpyRemote-unsigned.ipa
          echo "--- Payload ---"; ls Payload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 14
