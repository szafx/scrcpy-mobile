name: Build unsigned IPA

# 阶段一目标：不写任何新代码，先把「原样构建」在 CI 上跑通。
# 产出一个不签名 IPA，用 Sideloadly 重签后装进手机（和 locus-china-fix 那套一样）。
#
# 用法：
#   1. 把 wsvn53/scrcpy-mobile fork 到自己的 GitHub 账号
#   2. 把本文件放到 fork 的 .github/workflows/build-ipa.yml
#   3. Actions 页面手动触发（或 push 到 main）
#   4. 跑完在 Artifacts 里下载 ScrcpyRemote-unsigned.ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: 检出代码（含全部 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 显示环境信息
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== iOS SDK ==="; xcrun --sdk iphoneos --show-sdk-version
          echo "=== 构建工具 ==="
          for t in cmake ninja meson pkg-config nasm python3; do
            printf '%-12s ' "$t"; command -v $t || echo '(缺)'
          done
          echo "=== Android SDK（scrcpy-server 要用）==="
          ls -d "$HOME/Library/Android/sdk" 2>/dev/null || echo "(无)"
          echo "=== JDK ==="
          /usr/libexec/java_home -V 2>&1 | head -6 || true

      - name: 安装构建依赖
        run: |
          brew install meson ninja pkg-config nasm 2>&1 | tail -15

      - name: 准备 JDK 17
        run: |
          brew install openjdk@17 2>&1 | tail -5
          JDK="$(brew --prefix openjdk@17)"
          echo "JAVA_HOME=$JDK" >> $GITHUB_ENV
          echo "$JDK/bin" >> $GITHUB_PATH

      - name: 构建 porting 库
        run: make libs

      - name: 编译 App（不签名）
        run: |
          xcodebuild \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app out/Payload/
          cd out && zip -qry ../ScrcpyRemote-unsigned.ipa Payload
          ls -lh ../ScrcpyRemote-unsigned.ipa
          echo "--- Payload ---"; ls Payload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 14
