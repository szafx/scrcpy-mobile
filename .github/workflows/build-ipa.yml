name: Build unsigned IPA

# 不签名 IPA，用 Sideloadly 重签后装进手机。
#
# 三个上游坑（已在这份 workflow 里绕过）：
#   1. porting/Makefile 的 all 目标里有个悬空的 `ish`（无规则）→ 不能直接 make libs，要逐个目标调
#   2. external/adb-mobile 需要 protoc → brew install protobuf
#   3. porting/libtsnet 上游漏了 go.mod（只有 go.sum）→ 现场 go mod init
#      而 Xcode 链接要靠它产出 libtsnet-forwarder.a（make libs 不含这一步）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: 检出代码（含全部 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 准备 Go（libtsnet 要用）
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 显示环境信息
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== iOS SDK ==="; xcrun --sdk iphoneos --show-sdk-version
          echo "=== Go ==="; go version
          echo "=== 构建工具 ==="
          for t in cmake ninja meson pkg-config nasm protoc; do
            printf '%-12s ' "$t"; command -v $t || echo '(缺)'
          done
          echo "=== Android SDK（scrcpy-server 要用）==="
          ls -d "$HOME/Library/Android/sdk" 2>/dev/null && echo "  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== JDK ==="
          /usr/libexec/java_home -V 2>&1 | head -6 || true

      - name: 安装构建依赖
        run: |
          brew install meson ninja pkg-config nasm fmt googletest 2>&1 | tail -15

      - name: 安装 protobuf 28.3（源码编译，用它自带的 abseil）
        run: |
          # 为什么必须自己编：
          #   1. adb-mobile 的 check-protobuf-version 拿 `protoc --version` 去 grep 它自带的
          #      porting/protobuf.rb —— 版本必须是 28.3（brew 当前的更新，过不了）
          #   2. 只装 protoc 可执行文件不够：CMake 要 find_package(Protobuf)，需要头文件 + 库，
          #      而 protoc 的 release zip 里只有 bin/ 和 include/
          #   3. 新 Homebrew 不允许 brew install ./file.rb（formula 必须在 tap 里）
          #   4. ★ 就算绕过 3 装上了作者的 formula，它的 bottle 是 2024 年编的，链接的是
          #      当时的 abseil 2407.0.0，而 brew 现在给的是 20260817.0 —— dyld 直接 abort
          # 所以：从官方源码 tarball 编，并用 -Dprotobuf_ABSL_PROVIDER=module 让它用
          #       自己 third_party 里那套 abseil，彻底不碰 brew 的 abseil。
          brew unlink protobuf 2>/dev/null || true
          curl -fL -o /tmp/pb.tgz \
            https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protobuf-28.3.tar.gz
          tar xzf /tmp/pb.tgz -C /tmp
          cd /tmp/protobuf-28.3
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="$HOME/pb283" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_EXAMPLES=OFF \
            -Dprotobuf_ABSL_PROVIDER=module
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --install build
          echo "$HOME/pb283/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$HOME/pb283" >> $GITHUB_ENV
          echo "--- 验证 ---"
          "$HOME/pb283/bin/protoc" --version
          ls "$HOME/pb283/lib" | head

      - name: 准备 JDK 17
        run: |
          brew install openjdk@17 2>&1 | tail -5
          JDK="$(brew --prefix openjdk@17)"
          echo "JAVA_HOME=$JDK" >> $GITHUB_ENV
          echo "$JDK/bin" >> $GITHUB_PATH

      - name: 构建 porting 库
        working-directory: porting
        run: |
          set -e
          echo "===== [1/6] adb-mobile ====="
          make adb-mobile
          echo "===== [2/6] SDL ====="
          make libsdl
          echo "===== [3/6] FFmpeg ====="
          make ffmpeg
          echo "===== [4/6] scrcpy ====="
          make scrcpy
          echo "===== [5/6] scrcpy-server ====="
          make scrcpy-server
          echo "===== [6/6] libtsnet（上游缺 go.mod，现场补）====="
          cd libtsnet
          if [ ! -f go.mod ]; then
            go mod init me.wsen.scrcpy-tsnet
          fi
          go mod tidy
          cd ..
          make tsnet-forwarder
          echo "===== 产物清单 ====="
          ls -lh libs/iphoneos/arm64/ | head -40

      - name: 编译 App（不签名）
        run: |
          xcodebuild \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app out/Payload/
          cd out && zip -qry ../ScrcpyRemote-unsigned.ipa Payload
          ls -lh ../ScrcpyRemote-unsigned.ipa
          echo "--- Payload ---"; ls Payload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 14
