name: Build unsigned IPA

# 不签名 IPA，用 Sideloadly / TrollStore 装进手机。
#
# ★ 这份 workflow 是照着一份**已经跑通 20+ 次**的配方改的：
#   https://github.com/haha1314521/scrcpy-mobile/blob/main/.github/workflows/build-ipa.yml
#   （它构建的就是当前的 scrcpy-app，8~9 分钟出 32MB IPA，用 macos-15 + Xcode 16.4）
#   加了我们自己的 libfrp（内嵌 frp visitor）。
#
# 之前走过的一大堆弯路，都别再走：
#   ✗ 换 macos-14 + Xcode 15.4 —— 工程是 objectVersion 77（Xcode 16 格式，
#     有 PBXFileSystemSynchronizedRootGroup），Xcode 15 根本打不开；而且小组件
#     部署目标是 18.2，要 iOS 18 SDK
#   ✗ 用 brew 装 protobuf 28.3 / 自己编 abseil 20240722 —— adb-mobile **自带
#     protobuf 子模块**（含 abseil），-Dprotobuf_ABSL_PROVIDER=module 直接编就行
#   ✗ 挪 brew 的 openssl 头 —— 那条路没走到过，实测真实失败点是 libs/ 子目录没建
#   ✗ 给 make-adb.sh 打 sed 补丁 —— 路径本身就是错的（脚本在 porting/scripts/ 下）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# ★ 同一分支只留最新一轮。
#   之前没配这个，连续推几个提交就会有好几个 job 同时在编（每个 ~10 分钟、还白占
#   macOS runner 额度），得手动去停。开 cancel-in-progress 之后，
#   新的提交一推，旧的自动取消 —— 反正新提交的内容包含旧的。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CMake 4.x 对 lz4/zstd 这些老库兼容性差，官方逃生阀
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    runs-on: macos-15          # 默认 Xcode 16.4，正好够这个工程
    timeout-minutes: 300       # FFmpeg 要编 3 个 ABI，留足余量

    steps:
      - name: 检出代码（含全部 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 准备 Go（libtsnet / libfrp 要用）
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: porting/libtsnet/go.sum

      - name: 安装构建工具
        run: |
          brew install meson ninja nasm ffmpeg sdl2 fmt lz4 brotli zstd googletest
          # ★ gas-preprocessor.pl：FFmpeg 编 arm64 时 configure 会 check_gas，
          #   runner 上不自带，缺了就直接 die:
          #     "GNU assembler not found, install/update gas-preprocessor"
          curl -fsSL -o /opt/homebrew/bin/gas-preprocessor.pl \
            https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl
          chmod +x /opt/homebrew/bin/gas-preprocessor.pl
          echo "=== 环境 ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          for t in cmake meson ninja nasm protoc gas-preprocessor.pl go; do
            printf '%-22s ' "$t"; command -v "$t" || echo '(缺)'
          done

      - name: 缓存 porting 产物
        id: libcache
        uses: actions/cache@v4
        with:
          path: |
            porting/libs
            scrcpy/x
          key: porting-libs-v3-${{ hashFiles('porting/Makefile', 'porting/scripts/**', 'porting/cmake/**', '.gitmodules') }}

      # ★ 只有「编译 host 版 protobuf」那一步需要子模块的 tag（adb-mobile 的
      #   make-protobuf.sh 里 `git checkout v$protoc_version` + abseil `git checkout 20240722.0`），
      #   而那一步本身就带 cache 条件，并且它自己在 checkout 前又跑了一遍
      #   `git fetch --tags --force` —— 所以 cache 命中时这步纯属白等。
      #
      #   实测：cache 命中时它要 198~229 秒（全流程最贵的一步，仅次于 xcodebuild）。
      #   条件写成和 protobuf 那步**一模一样**，两者永远同开同关，
      #   不可能出现「protobuf 编了但 tag 没拉」的组合。
      #
      #   cache 命中时唯一还会跑的编译步骤是 `make -C porting scrcpy` ——
      #   make-scrcpy.sh 里没有任何 git 命令（纯 cmake），scrcpy 自己的 meson.build
      #   版本号也是硬编码的 '4.1'，不是 git describe。所以不需要 tag。
      #
      # ★★ 顺序是这步的要害：**必须排在「缓存 porting 产物」后面**。
      #    它的 if 引用 steps.libcache.outputs.cache-hit，而 GitHub Actions 对
      #    「前面还不存在的 step 输出」求值成空串 → `'' != 'true'` 恒为真 →
      #    加了 if 照样跑。实测踩过：第一次把 if 加上去，那步还是跑了 229 秒。
      - name: 拉子模块的 tag（脚本里要按 tag 检出）
        if: steps.libcache.outputs.cache-hit != 'true'
        run: git submodule foreach --recursive 'git fetch --tags --force --prune || true'

      # ★★ 这步是之前真正卡住的原因：
      #   上游 porting/Makefile 的 mkdir-output 只建了 libs，没建子目录，
      #   于是 make adb-mobile 编完之后那一下 cp 直接失败：
      #     cp: ./libs/iphoneos/arm64: No such file or directory
      #   （所有编译其实都成功了，死在拷文件）
      - name: 预建 libs 子目录
        run: |
          mkdir -p porting/libs/iphoneos/arm64
          mkdir -p porting/libs/iphonesimulator/arm64
          mkdir -p porting/libs/iphonesimulator/x86_64
          mkdir -p porting/libs/include

      - name: 编译 host 版 protobuf 28.3（用 adb-mobile 自带的子模块）
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          # adb-mobile 的 external/protobuf 子模块**自带 abseil**，
          # 所以 -Dprotobuf_ABSL_PROVIDER=module 能直接用，完全不碰 brew 的 abseil。
          # （用 release tarball 就不行 —— 那个里 third_party/abseil-cpp 是空的）
          cd external/adb-mobile/external/protobuf
          git fetch --tags --force
          git checkout v28.3
          git submodule update --init --recursive
          # absl 在 arm64 mac 上会误判架构、塞进 x86 专用编译选项，去掉
          find third_party/abseil-cpp/absl/copts -name '*.cmake' \
            -exec sed -i '' 's/-msse4\.1//g; s/-maes//g' {} +
          cmake -S . -B out-host \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_ABSL_PROVIDER=module \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_CXX_STANDARD=17
          cmake --build out-host -j 8
          sudo cmake --install out-host
          protoc --version      # 必须是 28.3（adb-mobile 的版本检查会校验）

      - name: 造一个 zstd 程序的空壳（iOS 交叉编译不该编 zstd 命令行工具）
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          printf '# Stub for iOS cross build - do not build zstd command-line programs\n' \
            > external/adb-mobile/porting/cmake/CMakeLists.zstd.txt

      - name: 编译 adb-mobile
        if: steps.libcache.outputs.cache-hit != 'true'
        env:
          CFLAGS: -I/opt/homebrew/include
          CXXFLAGS: -I/opt/homebrew/include
        run: |
          make -C porting adb-mobile
          # 别被"没报错"骗了：验证真的编出了东西
          if ! nm porting/libs/iphoneos/arm64/libadb-full.a 2>/dev/null | grep -q "T _adb_commandline_porting"; then
            echo "::error::libadb-full.a 里没有 adb_commandline_porting —— adb 核心其实没编出来"
            exit 1
          fi

      - name: 编译 SDL3
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting libsdl

      - name: 编译 FFmpeg
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting ffmpeg

      # porting/src 不在缓存键里，所以 libscrcpy 每次都重编（约 5 分钟），保证移植层改动生效
      - name: 编译 libscrcpy
        run: make -C porting scrcpy

      - name: 编译 OpenSSL
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting openssl

      - name: 编译 vncclient
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting vncclient

      # ★★ 一个库管两个功能（frp visitor + tsnet），**故意不拆成两步**：
      #   Go 的 -buildmode=c-archive 每个库自带一整套 Go runtime，
      #   两个这样的库进同一个 App → 重名符号被去重 → 共用一套 runtime 状态 → 一调用就崩。
      #   实测铁证：App 二进制里 `\xff Go buildinf:`（Go 运行时指纹）出现过 2 次。
      #   libtsnet 的代码已并进 porting/libfrp/libtsnet/，编译入口是 libfrp 的 cmd/c-binding。
      - name: 编译 libmobile（frp + tsnet，合成一个 c-archive）
        run: |
          cd porting/libfrp
          go mod tidy
          make build-iphoneos-arm64
          cp -v build/iphoneos/arm64/libmobile-forwarder.a ../libs/iphoneos/arm64/
          cp -v build/iphoneos/arm64/libmobile-forwarder.h ../libs/include/
          cd ..
          echo "=== 产物清单 ==="
          ls -lh libs/iphoneos/arm64/
          # 自检：两边的导出符号都要在，少一个说明合并没生效
          for sym in _frp_start_visitor _tsnet_start_forward; do
            if ! nm libs/iphoneos/arm64/libmobile-forwarder.a 2>/dev/null | grep -q "$sym"; then
              echo "::error::libmobile-forwarder.a 里没有 $sym —— 合并漏了东西"
              exit 1
            fi
          done
          echo "✅ frp 和 tsnet 的符号都在"

      # ⚠️ 只能删 porting/build，**不能删 scrcpy/x**！
      #    scrcpy/x 是 meson 的构建目录（make scrcpy 里 `meson setup x` 生成的），
      #    工程的头文件搜索路径里写着 $(SRCROOT)/../scrcpy/x，
      #    而 ScrcpyRuntime.m 要 #import "app/config.h" —— 那个头正是生成在 scrcpy/x/app/。
      #    删了它，App 编译直接报：'app/config.h' file not found。
      #    （参考仓库那份跑通 20+ 次的配方里根本没有这一步。）
      - name: 清掉中间产物腾磁盘
        run: rm -rf porting/build

      - name: 编译 App（不签名）
        working-directory: scrcpy-app
        run: |
          xcodebuild \
            -project "Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      # ★★ 防「本地化被静默截断」。
      #   .strings 里只要有一行非法，Xcode 的 builtin-copyStrings 就会**提前停止解析**，
      #   而且**不报错** —— 后面的词条一条也进不了 bundle。
      #   2026-09-24 实测踩到：zh-Hans 里混进了一段 UTF-8 字节，导致第 433 行之后的
      #   词条（含新加的 96 条）全部丢失，而构建一直是绿的、看不出来。
      #   这里把「源文件有多少 key」和「bundle 里实际有多少」对一下，对不上就红。
      - name: 校验本地化没被静默截断
        working-directory: scrcpy-app
        run: |
          python3 - <<'PYEOF'
          import plistlib, re, sys, pathlib

          src = pathlib.Path("Scrcpy Remote")
          apps = list(pathlib.Path("build/DerivedData/Build/Products").glob("**/Release-iphoneos/*.app"))
          assert apps, "找不到编译出来的 .app"
          app = apps[0]
          print("app:", app)

          bad = False
          for lang in ("zh-Hans", "en", "ja", "ko"):
              raw = src / f"{lang}.lproj" / "Localizable.strings"
              if not raw.exists():
                  print(f"SKIP {lang}: 源文件不存在")
                  continue
              text = raw.read_bytes().decode("utf-16")
              want = len(set(re.findall(r'"((?:[^"\\]|\\.)+)"\s*=', text)))
              builtin = plistlib.loads((app / f"{lang}.lproj" / "Localizable.strings").read_bytes())
              got = len(builtin)
              print(f"{'OK  ' if got >= want else 'FAIL'} {lang}: 源 {want} 条 / bundle {got} 条")
              if got < want:
                  bad = True

          if bad:
              print("::error::本地化被截断 —— .strings 里有非法行会让 builtin-copyStrings 提前停止解析，且不报错")
              sys.exit(1)
          print("✅ 四种语言的词条数都对得上")
          PYEOF

      - name: 打包成 IPA
        run: |
          set -x
          APP_PATH=$(find scrcpy-app/build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | grep -i iphoneos | head -1)
          echo "找到 app: $APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" || echo "unknown")
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry "ScrcpyRemote-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 14
