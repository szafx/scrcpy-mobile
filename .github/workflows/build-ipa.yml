name: Build unsigned IPA

# 不签名 IPA，用 Sideloadly 重签后装进手机。
#
# 三个上游坑（已在这份 workflow 里绕过）：
#   1. porting/Makefile 的 all 目标里有个悬空的 `ish`（无规则）→ 不能直接 make libs，要逐个目标调
#   2. external/adb-mobile 需要 protoc → brew install protobuf
#   3. porting/libtsnet 上游漏了 go.mod（只有 go.sum）→ 现场 go mod init
#      而 Xcode 链接要靠它产出 libtsnet-forwarder.a（make libs 不含这一步）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # macos-14 上才有 Xcode 15.x。用 Xcode 16 编 adb-mobile 里 vendored 的
    # BoringSSL 会报一堆 "use of undeclared identifier 'bssl'"（老 BoringSSL 与新 clang
    # 不兼容），所以钉在 15.4。
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: 检出代码（含全部 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 选用 Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 准备 Go（libtsnet 要用）
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 显示环境信息
        run: |
          echo "=== macOS ==="; sw_vers
          echo "=== Xcode ==="; xcodebuild -version
          echo "=== iOS SDK ==="; xcrun --sdk iphoneos --show-sdk-version
          echo "=== Go ==="; go version
          echo "=== 构建工具 ==="
          for t in cmake ninja meson pkg-config nasm protoc; do
            printf '%-12s ' "$t"; command -v $t || echo '(缺)'
          done
          echo "=== Android SDK（scrcpy-server 要用）==="
          ls -d "$HOME/Library/Android/sdk" 2>/dev/null && echo "  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== JDK ==="
          /usr/libexec/java_home -V 2>&1 | head -6 || true

      - name: 安装构建依赖
        run: |
          brew install meson ninja pkg-config nasm fmt googletest 2>&1 | tail -15

      - name: 换用 CMake 3.31（CMake 4 对 zstd/lz4 这些老库兼容性太差）
        run: |
          # runner 自带的是 CMake 4.x，它在 configure 老项目时直接报错：
          #   - cmake_minimum_required(VERSION <3.5) 被移除兼容 → 设 CMAKE_POLICY_VERSION_MINIMUM 能顶一阵
          #   - 但 zstd 的 programs/CMakeLists.txt:40 (install) 还是会错，那个逃生阀管不了
          # 索性换成 3.31 系（官方 universal 包，不用 brew，避免版本漂移）
          curl -fL -o /tmp/cmake.tgz \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar xzf /tmp/cmake.tgz -C "$HOME"
          CMBIN="$HOME/cmake-3.31.6-macos-universal/CMake.app/Contents/bin"
          ls "$CMBIN" | head
          echo "$CMBIN" >> $GITHUB_PATH
          # 让 brew 那个别抢
          brew unlink cmake 2>/dev/null || true
          "$CMBIN/cmake" --version
      - name: 把 abseil 换成 20240722（adb 的 LOG(VERBOSE) 需要它）
        run: |
          # ★ 这是整条链最关键的版本约束，前面几条弯路都是因为它：
          #   adb 的源码用 LOG(VERBOSE)，展开成 ABSL_LOG_INTERNAL_LOG_VERBOSE —— 这个宏
          #   在新版 abseil 里被删了。用 brew 当前的 abseil 会直接编译失败：
          #     error: use of undeclared identifier 'ABSL_LOG_INTERNAL_LOG_VERBOSE'
          #   所以必须用 20240722（= abseil 2407.0.0），也就是作者当时配套的那版。
          #   换上它之后，作者 protobuf.rb 里 28.3 的预编译 bottle 也能正常用了
          #   —— 那个 bottle 正是链的 2407.0.0，前面单独装会 dyld 报错。
          brew uninstall --ignore-dependencies abseil 2>/dev/null || true
          curl -fL -o /tmp/absl.tar.gz \
            https://github.com/abseil/abseil-cpp/releases/download/20240722.0/abseil-cpp-20240722.0.tar.gz
          tar xzf /tmp/absl.tar.gz -C /tmp
          cd /tmp/abseil-cpp-20240722.0
          # ★ 装到 /opt/homebrew/opt/abseil —— 不是随便找个地方：
          #   作者那个 protobuf bottle 里的 protoc 把依赖写死成
          #     /opt/homebrew/opt/abseil/lib/libabsl_*.2407.0.0.dylib
          #   而 /opt/homebrew/opt/abseil 是 brew 的符号链接。装到别处 protoc 找不到。
          PREFIX="$(brew --prefix)/opt/abseil"
          rm -rf "$PREFIX"
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_CXX_STANDARD=17 \
            -DABSL_PROPAGATE_CXX_STD=ON \
            -DABSL_BUILD_TESTING=OFF \
            -DABSL_ENABLE_INSTALL=ON
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --install build
          # 让编译器（/opt/homebrew/include）和链接器（/opt/homebrew/lib）也能看到
          BREW="$(brew --prefix)"
          rm -rf "$BREW/include/absl"
          ln -s "$PREFIX/include/absl" "$BREW/include/absl"
          for f in "$PREFIX"/lib/libabsl_*.dylib; do
            ln -sf "$f" "$BREW/lib/$(basename "$f")"
          done
          echo "--- 验证：2407.0.0 的库在位 ---"
          ls "$PREFIX/lib"/libabsl_die_if_null* | head -3

      - name: 安装 protobuf 28.3（用作者的 formula，现在 abseil 版本对得上了）
        run: |
          TAP="$(brew --repository)/Library/Taps/local/homebrew-protobuf/Formula"
          mkdir -p "$TAP"
          cp external/adb-mobile/porting/protobuf.rb "$TAP/protobuf.rb"
          # ★ 必须 --ignore-dependencies：
          #   formula 里有 depends_on "abseil"，而 brew 会去装**当前**的 abseil
          #   （20260817.0），把我们上一步刚编好的 20240722 连头文件一起覆盖掉，
          #   于是 adb 又编不过了。protobuf 是预编译 bottle，本来也不需要 brew 帮它配依赖。
          brew install --ignore-dependencies local/protobuf/protobuf
          echo "--- 验证 ---"
          protoc --version
          echo "--- 确认 abseil 还是 20240722（应能列出 2407.0.0 的库）---"
          ls "$(brew --prefix)/lib"/libabsl_die_if_null* | head -3

      - name: 绕过 adb-mobile 的 protobuf 版本检查
        run: |
          M=external/adb-mobile/Makefile
          cp "$M" "$M.bak"
          sed -i '' 's/^all: check-protobuf-version libs/all: libs/' "$M"
          sed -i '' 's/^check-protobuf-version:/check-protobuf-version-SKIPPED:/' "$M"
          echo "--- 改后的前 12 行 ---"
          head -12 "$M"

      - name: 准备 JDK 17
        run: |
          brew install openjdk@17 2>&1 | tail -5
          JDK="$(brew --prefix openjdk@17)"
          echo "JAVA_HOME=$JDK" >> $GITHUB_ENV
          echo "$JDK/bin" >> $GITHUB_PATH

      - name: 构建 porting 库
        working-directory: porting
        env:
          # CMake 4.x 移除了对 cmake_minimum_required(VERSION <3.5) 的兼容，
          # 而 adb-mobile 依赖的 lz4 等老库还用着老写法，直接 configure 失败。
          # 这是官方给的逃生阀。
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          set -e
          echo "===== [1/6] adb-mobile ====="
          make adb-mobile
          echo "===== [2/6] SDL ====="
          make libsdl
          echo "===== [3/6] FFmpeg ====="
          make ffmpeg
          echo "===== [4/6] scrcpy ====="
          make scrcpy
          echo "===== [5/6] scrcpy-server ====="
          make scrcpy-server
          echo "===== [6/6] libtsnet（上游缺 go.mod，现场补）====="
          cd libtsnet
          if [ ! -f go.mod ]; then
            go mod init me.wsen.scrcpy-tsnet
          fi
          go mod tidy
          cd ..
          make tsnet-forwarder
          echo "===== [7/7] libfrp（内嵌给 App 的 frp visitor）====="
          cd libfrp
          go mod tidy
          make build-iphoneos-arm64
          cp -v build/iphoneos/arm64/libfrp-forwarder.a ../libs/iphoneos/arm64/
          cp -v build/iphoneos/arm64/libfrp-forwarder.h ../libs/include/
          cd ..
          echo "===== 产物清单 ====="
          ls -lh libs/iphoneos/arm64/ | head -40

      - name: 编译 App（不签名）
        run: |
          xcodebuild \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app out/Payload/
          cd out && zip -qry ../ScrcpyRemote-unsigned.ipa Payload
          ls -lh ../ScrcpyRemote-unsigned.ipa
          echo "--- Payload ---"; ls Payload/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 14
