name: Keep porting cache warm

# ★ 只干一件事：每 5 天「恢复」一次 porting 产物缓存，刷新它的 7 天存活计时。
#
#   背景：GitHub Actions 缓存在 7 天无人访问后会被清掉。清掉后的下一次正式构建
#   要从零编 protobuf / adb-mobile / SDL3 / FFmpeg（3 个 ABI）……实测 2026-10-06
#   从 ~9 分钟变成 30~50 分钟。这个 workflow 只做一次 cache restore（不编译），
#   让缓存一直热着；缓存的真正保存发生在 build-ipa.yml 的「Post 缓存 porting 产物」。
#
#   ★ 必须跑在 macos-15：GitHub 缓存按操作系统分域，ubuntu 的 job 够不到 macOS 存的缓存。
#   ★ key 必须和 build-ipa.yml 里的 key 完全一致（连 hashFiles 的输入列表都一样），
#     否则恢复的不是同一个缓存，白跑。

on:
  schedule:
    - cron: '23 4 */5 * *'    # 每 5 天 04:23 UTC（避开整点）
  workflow_dispatch:

jobs:
  touch:
    runs-on: macos-15
    steps:
      - name: 检出代码（只为算 hashFiles，不需要 submodule）
        uses: actions/checkout@v4

      - name: 恢复一次缓存（刷新访问时间，阻止过期清理）
        uses: actions/cache@v4
        with:
          path: |
            porting/libs
            scrcpy/x
          key: porting-libs-v3-${{ hashFiles('porting/Makefile', 'porting/scripts/**', 'porting/cmake/**', '.gitmodules') }}
